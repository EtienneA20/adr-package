# Site statique Docusaurus (trailingSlash: false), écoute sur 8080 (image nginx non-root).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Sonde de santé utilisée par le HEALTHCHECK de l'image.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Ressources fingerprintées : cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
