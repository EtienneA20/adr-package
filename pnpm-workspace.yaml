packages:
  - "packages/*"
  - "apps/*"

# Depuis pnpm 11, `allowBuilds` remplace `onlyBuiltDependencies` (désormais ignoré).
# N'autoriser que les scripts de build strictement nécessaires, paquet par paquet.
allowBuilds:
  esbuild: true
  # Binaire natif déjà fourni par les dépendances optionnelles : le script de repli est inutile.
  unrs-resolver: false
  "@swc/core": false

# Versions uniques partagées par tout le monorepo (`"typescript": "catalog:"`).
catalog:
  typescript: ~6.0.3
  eslint: ^9.39.5
  prettier: ^3.9.10
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  "@types/node": ^22.19.0

overrides:
  # eslint-plugin-tsdoc épingle une version de @typescript-eslint/utils qui refuse TypeScript 6 :
  # on l'aligne sur celle de typescript-eslint.
  "eslint-plugin-tsdoc>@typescript-eslint/utils": ^8.72.1
