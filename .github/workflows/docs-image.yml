name: Image de la documentation

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
      - ".github/workflows/docs-image.yml"

concurrency:
  group: docs-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/etiennea20/adr-docs

jobs:
  image:
    name: Build et push sur GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      # Contexte = racine du dépôt (le Dockerfile utilise turbo prune).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Quota GitHub Packages (500 Mo en offre gratuite, dépôt privé) : on ne garde que les
      # dernières versions de l'image.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: adr-docs
          package-type: container
          min-versions-to-keep: 5

      # TODO(déploiement) : la méthode de déploiement sur le serveur personnel n'est pas encore
      # choisie (pull manuel, Watchtower, webhook, runner auto-hébergé dédié…). L'étape de
      # déploiement s'insérera ici, après le push de l'image `${{ env.IMAGE }}:<sha>`.
