name: CI

on:
  pull_request:
    branches: [main]

# Une nouvelle poussée sur la PR annule l'exécution en cours.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: Titre de la PR (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            build
            perf
            revert

  checks:
    name: Lint, format, types, tests, skills, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Turborepo compare avec la branche de base de la PR pour `--affected`.
      TURBO_SCM_BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Commits de la PR (commitlint)
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Changeset présent si un package publié change
        # La PR « Version Packages » consomme les changesets ; Dependabot ne touche que des
        # devDependencies ou des actions.
        if: github.head_ref != 'changeset-release/main' && github.actor != 'dependabot[bot]'
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

      - name: Format (Prettier)
        run: pnpm format:check

      - name: Lint de la racine
        run: pnpm lint:root

      - name: Lint, typecheck, tests (couverture ≥ 90 %) et build des projets touchés
        run: pnpm exec turbo run lint typecheck test build --affected

      - name: TSDoc et SKILLS.md des exports publics
        run: pnpm check:skills

      - name: Skills Claude Code synchronisés
        run: pnpm run install:skills --check
